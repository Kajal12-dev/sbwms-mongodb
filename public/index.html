<script>
const { useState, useMemo, useEffect, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

/* ================= dates, money, ids ================= */
const DAY = 86400000;
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const TODAY = startOfDay(new Date());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / DAY);
const pad = (n) => String(n).padStart(2, '0');
const toInput = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (d) => d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtMoney = (n) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(n);
const fmtMoney0 = (n) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(n);
const round2 = (v) => Math.round(Number(v) * 100) / 100;
const fmtSize = (b) => b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

const CATEGORIES = ['Electronics', 'Appliances', 'Fashion', 'Automotive', 'Miscellaneous'];
const MAX_FILE = 10 * 1024 * 1024;
let _k = 0;
const uid = () => 'k' + (++_k);
const uuid = () => (window.crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });

/* purchase date + N months, clamped to the last day of shorter months (31 Jan + 1 month = 28/29 Feb) */
function addMonths(iso, months) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = m - 1 + months;
  const ty = y + Math.floor(t / 12);
  const tm = ((t % 12) + 12) % 12;
  const last = new Date(ty, tm + 1, 0).getDate();
  return new Date(ty, tm, Math.min(d, last));
}

function leftLabel(days) {
  if (days < 0) return 'Expired ' + (-days) + (days === -1 ? ' day ago' : ' days ago');
  if (days === 0) return 'Expires today';
  if (days <= 60) return days + (days === 1 ? ' day left' : ' days left');
  const m = Math.round(days / 30.44);
  if (m < 24) return m + ' months left';
  const y = Math.floor(m / 12), r = m % 12;
  return r ? y + ' yr ' + r + ' mo left' : y + ' yr left';
}
function expiryHint(days) {
  if (days < 0) return 'Already expired';
  if (days === 0) return 'Expires today';
  if (days <= 60) return 'In ' + days + (days === 1 ? ' day' : ' days');
  const m = Math.round(days / 30.44);
  if (m < 24) return 'In ' + m + ' months';
  const y = Math.floor(m / 12), r = m % 12;
  return r ? 'In ' + y + ' yr ' + r + ' mo' : 'In ' + y + ' yr';
}

/* what the expiry cell shows for one line item while typing */
function expiryInfo(dateIso, monthsStr) {
  if (monthsStr === '' || monthsStr === null) return { kind: 'empty' };
  const n = Number(monthsStr);
  if (!Number.isInteger(n) || n < 0 || n > 120) return { kind: 'invalid' };
  if (n === 0) return { kind: 'none' };
  if (!dateIso) return { kind: 'pending' };
  const date = addMonths(dateIso, n);
  return { kind: 'date', date, iso: toInput(date), days: daysBetween(TODAY, date) };
}

/* ================= data model =================
   The app's single source of truth is the same shape the database insert uses:
   one record = { bill: {...bills row}, items: [ {...bill_items row}, ... ] }.
   Everything on screen is derived from these records by enrich(). */
function fileProblem(file) {
  if (!file) return '';
  const okType = file.type === 'application/pdf' || file.type.startsWith('image/');
  if (!okType) return 'Choose a PDF or an image (JPG, PNG, WebP).';
  if (file.size > MAX_FILE) return 'This file is ' + fmtSize(file.size) + '. The limit is 10 MB.';
  return '';
}

function validate(f, file) {
  const e = { items: {} };
  if (!f.store.trim()) e.store = 'Enter the store name.';
  else if (f.store.trim().length > 80) e.store = 'Keep the store name under 80 characters.';
  if (!f.invoice.trim()) e.invoice = 'Enter the invoice or receipt number.';
  else if (f.invoice.trim().length > 40) e.invoice = 'Keep the number under 40 characters.';
  if (!f.date) e.date = 'Pick the purchase date.';
  else if (f.date > toInput(TODAY)) e.date = 'The purchase date cannot be in the future.';
  if (f.amount === '' || !(Number(f.amount) > 0)) e.amount = 'Enter a total above 0.';
  const fp = fileProblem(file);
  if (fp) e.file = fp;
  f.items.forEach((it) => {
    const ie = {};
    if (!it.name.trim()) ie.name = 'Enter the item name.';
    if (it.price === '' || !(Number(it.price) >= 0)) ie.price = 'Enter a price.';
    const mo = Number(it.months);
    if (it.months === '' || !Number.isInteger(mo) || mo < 0 || mo > 120) ie.months = 'Whole months, 0 to 120.';
    if (Object.keys(ie).length) e.items[it.key] = ie;
  });
  e.any = Object.keys(e).some((k) => k !== 'items' && k !== 'any' && e[k]) || Object.keys(e.items).length > 0;
  return e;
}

function buildPayload(f, file) {
  const billId = uuid();
  return {
    bill: {
      id: billId,
      store_name: f.store.trim(),
      invoice_number: f.invoice.trim(),
      purchase_date: f.date,
      category: f.category,
      total_amount: round2(f.amount),
      currency: 'INR',
      receipt: file ? { file_name: file.name, mime_type: file.type, size_bytes: file.size } : null,
      created_at: new Date().toISOString()
    },
    items: f.items.map((it, i) => {
      const months = Number(it.months);
      return {
        id: uuid(),
        bill_id: billId,
        line_no: i + 1,
        item_name: it.name.trim(),
        price: round2(it.price),
        warranty_months: months,
        warranty_expiry_date: months > 0 ? toInput(addMonths(f.date, months)) : null
      };
    })
  };
}

const SEED = SEED_DEFS.map(([store, invoice, category, ago, items, receipt], i) => {

    bill: {
      id, store_name: store, invoice_number: invoice, purchase_date: date, category,
      total_amount: round2(items.reduce((s, it) => s + it[1], 0)), currency: 'INR',
      receipt: receipt ? { file_name: receipt, mime_type: 'application/pdf', size_bytes: 150000 + i * 9000 } : null,
      created_at: purchased.toISOString()
    },
    items: items.map(([name, price, months], j) => ({
      id: id + '-i' + (j + 1), bill_id: id, line_no: j + 1, item_name: name, price, warranty_months: months,
      warranty_expiry_date: months > 0 ? toInput(addMonths(date, months)) : null
    }))
  };
});
const SEED_IDS = new Set(SEED.map((r) => r.bill.id));

/* derive everything the screens need from one record */
function enrich(rec) {
  const b = rec.bill;
  const items = rec.items.map((it) => {
    const expiry = it.warranty_expiry_date ? parseISO(it.warranty_expiry_date) : null;
    const days = expiry ? daysBetween(TODAY, expiry) : null;
    const status = days === null ? 'none' : days < 0 ? 'expired' : days <= 30 ? 'expiring' : 'active';
    return { ...it, expiry, days, status };
  });
  const covered = items.filter((i) => i.status !== 'none');
  const live = covered.filter((i) => i.days >= 0).sort((a, c) => a.days - c.days);
  let status = 'none', focus = null;
  if (live.length) { focus = live[0]; status = live[0].days <= 30 ? 'expiring' : 'active'; }
  else if (covered.length) { focus = [...covered].sort((a, c) => c.days - a.days)[0]; status = 'expired'; }
  return {
    id: b.id, rec, store: b.store_name, invoice: b.invoice_number, category: b.category, amount: b.total_amount,
    purchased: parseISO(b.purchase_date), receipt: b.receipt, items, coveredCount: covered.length, status, focus
  };
}

/* persistence: only what the person changed (added bills, removed sample bills) so samples stay fresh */
const STORE_KEY = 'sbwms.records.v1';
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const ok = (r) => r && r.bill && r.bill.id && Array.isArray(r.items);
      return { added: Array.isArray(p.added) ? p.added.filter(ok) : [], removed: Array.isArray(p.removed) ? p.removed : [] };
    }
  } catch (e) { /* storage unavailable */ }
  return { added: [], removed: [] };
}
function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }

/* backend: Express + MongoDB (server.js). Same origin when served by the server; direct to :3000 if opened as a file */
const API_BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
const SHOW_SAMPLE_DATA = true; /* set to false to list only the bills stored in MongoDB */
async function api(method, path, body) {
  const res = await fetch(API_BASE + path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.status === 204 ? null : res.json();
}

function highlight(json) {
  const esc = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc.replace(/("(?:\\.|[^"\\])*"(?:\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g, (m) => {
    let c = 'tk-num';
    if (m.charAt(0) === '"') c = m.charAt(m.length - 1) === ':' ? 'tk-key' : 'tk-str';
    else if (m === 'null') c = 'tk-null';
    else if (m === 'true' || m === 'false') c = 'tk-bool';
    return '<span class="' + c + '">' + m + '</span>';
  });
}

  code: 'M16 18l6-6-6-6M8 6l-6 6 6 6'
};
const Icon = ({ name, size = 18, className = '' }) => html`
  <svg className=${className} width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d=${ICONS[name]} /></svg>`;

const STATUS = {
  active: { label: 'Active', cls: 'bg-goodsoft text-good border-transparent', dot: 'bg-good' },
  expiring: { label: 'Expiring', cls: 'bg-warnsoft text-warn border-transparent', dot: 'bg-warnbar' },
  expired: { label: 'Expired', cls: 'bg-critsoft text-crit border-transparent', dot: 'bg-crit' },
  none: { label: 'No warranty', cls: 'bg-surface2 text-ink2 border-line', dot: 'bg-ink3' }
};
const StatusBadge = ({ status }) => {
  const s = STATUS[status];
  return html`<span className=${'inline-flex items-center gap-1.5 whitespace-nowrap rounded-full border px-2.5 py-0.5 text-xs font-medium ' + s.cls}>
    <span className=${'h-1.5 w-1.5 rounded-full ' + s.dot}></span>${s.label}</span>`;
};

const iconBtn = 'grid h-8 w-8 shrink-0 place-items-center rounded-md text-ink2 transition-colors hover:bg-accentsoft hover:text-accenttext';
const btnBase = 'inline-flex h-10 items-center justify-center gap-2 rounded-lg px-4 text-sm font-medium transition-colors';
const btnPrimary = btnBase + ' bg-accent text-white hover:brightness-110';
const btnGhost = btnBase + ' border border-line bg-surface text-ink hover:bg-surface2';
const btnDanger = btnBase + ' bg-critsolid text-white hover:brightness-110';

function RowActions({ bill, onView, onDownload, onDelete }) {
  return html`<div className="flex items-center justify-end gap-0.5">
    <button type="button" className=${iconBtn} title="View" aria-label=${'View bill ' + bill.invoice} onClick=${() => onView(bill)}><${Icon} name="eye" size=${17} /></button>
    <button type="button" className=${iconBtn} title="Download PDF" aria-label=${'Download PDF for ' + bill.invoice} onClick=${() => onDownload(bill)}><${Icon} name="download" size=${17} /></button>
    <button type="button" className="grid h-8 w-8 place-items-center rounded-md text-ink2 transition-colors hover:bg-critsoft hover:text-crit" title="Delete" aria-label=${'Delete bill ' + bill.invoice} onClick=${() => onDelete(bill)}><${Icon} name="trash" size=${17} /></button>
  </div>`;
}

function Modal({ title, onClose, children, footer, wide }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    if (ref.current) ref.current.focus();
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
      if (prev && prev.focus) prev.focus();
    };
  }, []);
  return html`<div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4">
    <div className="scrim absolute inset-0" onClick=${onClose}></div>
    <div ref=${ref} tabIndex="-1" role="dialog" aria-modal="true" aria-label=${title}
      className=${'pop rise relative flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-2xl border border-line bg-surface outline-none sm:rounded-2xl ' + (wide ? 'sm:max-w-2xl' : 'sm:max-w-md')}
      style=${{ paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
      <div className="flex items-center justify-between gap-3 border-b border-line px-5 py-4">
        <h2 className="min-w-0 truncate font-display text-lg font-semibold tracking-tight">${title}</h2>
        <button type="button" className=${iconBtn} aria-label="Close" onClick=${onClose}><${Icon} name="x" /></button>
      </div>
      <div className="scroll-x overflow-y-auto px-5 py-4">${children}</div>
      ${footer && html`<div className="flex flex-wrap justify-end gap-2 border-t border-line bg-surface2 px-5 py-3">${footer}</div>`}
    </div>
  </div>`;
}

function Field({ id, label, error, hint, className = '', srOnly = false, children }) {
  return html`<div className=${'flex min-w-0 flex-col gap-1.5 ' + className}>
    <label htmlFor=${id} className=${srOnly ? 'text-[13px] font-medium text-ink2 md:sr-only' : 'text-[13px] font-medium text-ink2'}>${label}</label>
    ${children}
    ${error && html`<p className="text-xs text-crit" id=${id + '-msg'}>${error}</p>`}
    ${!error && hint && html`<p className="text-xs text-ink3" id=${id + '-msg'}>${hint}</p>`}
  </div>`;
}
const ariaFor = (id, error, hint) => ({ 'aria-invalid': !!error, 'aria-describedby': (error || hint) ? id + '-msg' : undefined });

/* ================= add-bill modal ================= */
const ROW_GRID = 'md:grid-cols-[minmax(0,1fr)_116px_104px_156px_32px]';

function ExpiryCell({ info }) {
  let tone = 'bg-surface text-ink3 border-line';
  let main = '', sub = '';
  if (info.kind === 'empty') main = 'Enter months';
  else if (info.kind === 'invalid') { main = 'Check months'; tone = 'bg-critsoft text-crit border-transparent'; }
  else if (info.kind === 'none') main = 'No warranty';
  else if (info.kind === 'pending') main = 'Pick a purchase date';
  else {
    main = fmtDate(info.date);
    sub = expiryHint(info.days);
    tone = info.days < 0 ? 'bg-critsoft text-crit border-transparent' : info.days <= 30 ? 'bg-warnsoft text-warn border-transparent' : 'bg-goodsoft text-good border-transparent';
  }
  return html`<div className=${'flex min-h-[40px] flex-col justify-center rounded-lg border px-3 py-1 ' + tone} aria-live="polite">
    <span className="text-[13px] font-semibold leading-tight tabular-nums">${main}</span>
    ${sub && html`<span className="text-[11px] leading-tight opacity-90">${sub}</span>`}
  </div>`;
}

function ItemRow({ item, index, canRemove, err, dateIso, onChange, onRemove }) {
  const e = err || {};
  const info = expiryInfo(dateIso, item.months);
  const p = 'item-' + item.key;
  const set = (k) => (ev) => onChange(item.key, k, ev.target.value);
  return html`<li className="rounded-xl border border-line bg-surface2 p-3">
    <div className="mb-2 flex items-center justify-between md:hidden">
      <span className="text-xs font-semibold uppercase tracking-[0.06em] text-ink3">Item ${index + 1}</span>
      <button type="button" className=${iconBtn} aria-label=${'Remove item ' + (index + 1)} disabled=${!canRemove} onClick=${() => onRemove(item.key)}><${Icon} name="trash" size=${16} /></button>
    </div>
    <div className=${'grid grid-cols-2 items-start gap-3 ' + ROW_GRID}>
      <${Field} id=${p + '-name'} label="Item name" srOnly=${true} error=${e.name} className="col-span-2 md:col-span-1">
        <input id=${p + '-name'} className="field" placeholder="e.g. Split AC, 1.5 ton" maxLength="120" value=${item.name} onInput=${set('name')} ...${ariaFor(p + '-name', e.name)} />
      <//>
      <${Field} id=${p + '-price'} label="Price (₹)" srOnly=${true} error=${e.price}>
        <input id=${p + '-price'} type="number" min="0" step="0.01" inputMode="decimal" className="field" placeholder="Price (₹)" value=${item.price} onInput=${set('price')} ...${ariaFor(p + '-price', e.price)} />
      <//>
      <${Field} id=${p + '-months'} label="Warranty (months)" srOnly=${true} error=${e.months}>
        <input id=${p + '-months'} type="number" min="0" max="120" step="1" inputMode="numeric" list="warranty-presets" className="field" placeholder="Months" value=${item.months} onInput=${set('months')} ...${ariaFor(p + '-months', e.months)} />
      <//>
      <div className="col-span-2 flex min-w-0 flex-col gap-1.5 md:col-span-1">
        <span className="text-[13px] font-medium text-ink2 md:sr-only">Warranty expires</span>
        <${ExpiryCell} info=${info} />
      </div>
      <button type="button" className=${iconBtn + ' hidden md:grid md:mt-1 hover:!bg-critsoft hover:!text-crit disabled:opacity-40'} aria-label=${'Remove item ' + (index + 1)} disabled=${!canRemove} onClick=${() => onRemove(item.key)}><${Icon} name="trash" size=${16} /></button>
    </div>
  </li>`;
}

const newItem = () => ({ key: uid(), name: '', price: '', months: '12' });
const initialForm = () => ({ store: '', invoice: '', date: toInput(TODAY), category: 'Electronics', amount: '', items: [newItem()] });
const snapshot = (f) => JSON.stringify([f.store, f.invoice, f.date, f.category, f.amount, f.items.map((i) => [i.name, i.price, i.months])]);

function AddBillModal({ stores, onClose, onSubmit }) {
  const [f, setF] = useState(initialForm);
  const [file, setFile] = useState(null);
  const [thumb, setThumb] = useState(null);
  const [errors, setErrors] = useState(null);
  const [over, setOver] = useState(false);
  const [confirmClose, setConfirmClose] = useState(false);
  const initial = useRef(snapshot(f));
  const formRef = useRef(null);

  const dirty = snapshot(f) !== initial.current || !!file;
  const requestClose = useCallback(() => { dirty ? setConfirmClose(true) : onClose(); }, [dirty, onClose]);

  useEffect(() => {
    const prev = document.activeElement;
    const first = document.getElementById('f-store');
    if (first) first.focus();
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = ''; if (prev && prev.focus) prev.focus(); };
  }, []);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') requestClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [requestClose]);
  useEffect(() => {
    if (file && file.type.startsWith('image/')) {
      const url = URL.createObjectURL(file);
      setThumb(url);
      return () => URL.revokeObjectURL(url);
    }
    setThumb(null);
  }, [file]);

  const live = useMemo(() => (errors ? validate(f, file) : null), [errors, f, file]);
  const shown = live || { items: {} };
  const liveFileErr = fileProblem(file);

  const setField = (k) => (e) => setF((s) => ({ ...s, [k]: e.target.value }));
  const changeItem = (key, k, v) => setF((s) => ({ ...s, items: s.items.map((it) => it.key === key ? { ...it, [k]: v } : it) }));
  const removeItem = (key) => setF((s) => s.items.length > 1 ? { ...s, items: s.items.filter((it) => it.key !== key) } : s);
  const addItem = () => {
    setF((s) => ({ ...s, items: [...s.items, newItem()] }));
    setTimeout(() => {
      const inputs = formRef.current && formRef.current.querySelectorAll('[id$="-name"]');
      if (inputs && inputs.length) inputs[inputs.length - 1].focus();
    }, 0);
  };

  const itemsTotal = round2(f.items.reduce((s, it) => s + (Number(it.price) || 0), 0));
  const amountNum = f.amount === '' ? null : round2(f.amount);
  const diff = amountNum === null ? null : round2(amountNum - itemsTotal);

  const submit = (ev) => {
    ev.preventDefault();
    const res = validate(f, file);
    if (res.any) {
      setErrors(res);
      setTimeout(() => {
        const bad = formRef.current && formRef.current.querySelector('[aria-invalid="true"]');
        if (bad) { bad.focus(); if (bad.scrollIntoView) bad.scrollIntoView({ block: 'center' }); }
      }, 0);
      return;
    }
    onSubmit(buildPayload(f, file));
  };

  const amountHint = diff === null
    ? (itemsTotal > 0 ? 'Items add up to ' + fmtMoney(itemsTotal) + '.' : 'The total printed on the bill.')
    : diff === 0 ? 'Matches the items total.'
    : 'Items add up to ' + fmtMoney(itemsTotal) + ' (' + (diff > 0 ? fmtMoney(diff) + ' less' : fmtMoney(-diff) + ' more') + ' than the bill total). Tax and delivery can explain this.';

  return html`<div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4">
    <div className="scrim absolute inset-0" onClick=${() => { if (!dirty) onClose(); }}></div>
    <div role="dialog" aria-modal="true" aria-labelledby="modal-title"
      className="pop rise relative flex max-h-[94vh] w-full flex-col overflow-hidden rounded-t-2xl border border-line bg-surface sm:max-h-[90vh] sm:max-w-3xl sm:rounded-2xl"
      style=${{ paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>

      <div className="flex items-start justify-between gap-3 border-b border-line px-5 py-4">
        <div>
          <h2 id="modal-title" className="font-display text-xl font-semibold tracking-tight">Add bill and warranty</h2>
          <p className="text-[13px] text-ink3">Enter the bill details, then list each item you want to track.</p>
        </div>
        <button type="button" className=${iconBtn} aria-label="Close" onClick=${requestClose}><${Icon} name="x" /></button>
      </div>

      <form id="bill-form" ref=${formRef} onSubmit=${submit} noValidate className="scroll-x flex-1 overflow-y-auto px-5 py-5">
        <fieldset className="grid gap-4 sm:grid-cols-2">
          <legend className="mb-3 text-xs font-semibold uppercase tracking-[0.06em] text-ink3">Bill details</legend>
          <${Field} id="f-store" label="Store name" error=${shown.store}>
            <input id="f-store" className="field" list="store-options" placeholder="e.g. Croma" maxLength="80" autoComplete="off" value=${f.store} onInput=${setField('store')} ...${ariaFor('f-store', shown.store)} />
            <datalist id="store-options">${stores.map((s) => html`<option key=${s} value=${s}></option>`)}</datalist>
          <//>
          <${Field} id="f-invoice" label="Invoice / receipt number" error=${shown.invoice}>
            <input id="f-invoice" className="field font-mono text-[13px]" placeholder="e.g. CR-2026-118342" maxLength="40" autoComplete="off" value=${f.invoice} onInput=${setField('invoice')} ...${ariaFor('f-invoice', shown.invoice)} />
          <//>
          <${Field} id="f-date" label="Purchase date" error=${shown.date}>
            <input id="f-date" type="date" max=${toInput(TODAY)} className="field" value=${f.date} onInput=${setField('date')} ...${ariaFor('f-date', shown.date)} />
          <//>
          <${Field} id="f-category" label="Category">
            <div className="relative">
              <select id="f-category" className="field" value=${f.category} onChange=${setField('category')}>${CATEGORIES.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}</select>
              <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-ink3"><${Icon} name="chevron" size=${16} /></span>
            </div>
          <//>
          <${Field} id="f-amount" label="Total bill amount" error=${shown.amount} hint=${amountHint} className="sm:col-span-2">
            <div className="relative sm:max-w-xs">
              <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-ink3">₹</span>
              <input id="f-amount" type="number" min="0" step="0.01" inputMode="decimal" className="field" style=${{ paddingLeft: '28px' }} placeholder="0.00" value=${f.amount} onInput=${setField('amount')} ...${ariaFor('f-amount', shown.amount, amountHint)} />
            </div>
          <//>

          <div className="flex flex-col gap-1.5 sm:col-span-2">
            <span className="text-[13px] font-medium text-ink2">Receipt <span className="font-normal text-ink3">(optional)</span></span>
            <input id="f-receipt" type="file" accept="application/pdf,image/*" className="sr-only" aria-invalid=${!!(shown.file || liveFileErr)} aria-describedby="f-receipt-msg"
              onChange=${(e) => { const fl = e.target.files && e.target.files[0]; if (fl) setFile(fl); e.target.value = ''; }} />
            ${file
              ? html`<div className="flex items-center gap-3 rounded-xl border border-line bg-surface2 p-3">
                  ${thumb
                    ? html`<img src=${thumb} alt="Receipt preview" className="h-11 w-11 shrink-0 rounded-md border border-line object-cover" />`
                    : html`<span className="grid h-11 w-11 shrink-0 place-items-center rounded-md bg-accentsoft text-accenttext"><${Icon} name="file" size=${22} /></span>`}
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-sm font-medium">${file.name}</p>
                    <p className="text-xs text-ink3 tabular-nums">${fmtSize(file.size)} · ${file.type || 'unknown type'}</p>
                  </div>
                  <label htmlFor="f-receipt" className="cursor-pointer rounded-md px-2 py-1 text-[13px] font-medium text-accenttext hover:bg-accentsoft">Replace</label>
                  <button type="button" className=${iconBtn} aria-label="Remove receipt" onClick=${() => setFile(null)}><${Icon} name="x" size=${16} /></button>
                </div>`
              : html`<label htmlFor="f-receipt" className=${'drop flex cursor-pointer flex-col items-center gap-1 rounded-xl border border-dashed border-line px-4 py-5 text-center ' + (over ? 'over' : '')}
                  onDragOver=${(e) => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)}
                  onDrop=${(e) => { e.preventDefault(); setOver(false); const fl = e.dataTransfer.files && e.dataTransfer.files[0]; if (fl) setFile(fl); }}>
                  <span className="text-ink3"><${Icon} name="upload" size=${22} /></span>
                  <span className="text-sm"><span className="font-medium text-accenttext">Choose a file</span> <span className="text-ink2">or drop it here</span></span>
                  <span className="text-xs text-ink3">PDF, JPG, PNG or WebP, up to 10 MB</span>
                </label>`}
            <p id="f-receipt-msg" className=${'text-xs ' + ((shown.file || liveFileErr) ? 'text-crit' : 'sr-only')}>${shown.file || liveFileErr || 'No file problems.'}</p>
          </div>
        </fieldset>

        <fieldset className="mt-7">
          <div className="mb-3 flex flex-wrap items-end justify-between gap-2">
            <div>
              <legend className="float-left text-xs font-semibold uppercase tracking-[0.06em] text-ink3">Items on this bill (${f.items.length})</legend>
              <p className="clear-both text-xs text-ink3">Use 0 months for items without a warranty. Expiry = purchase date + warranty months.</p>
            </div>
            <button type="button" className=${btnGhost + ' !h-9'} onClick=${addItem}><${Icon} name="plus" size=${16} />Add item</button>
          </div>
          <div className=${'mb-1.5 hidden gap-3 px-3 text-xs font-medium text-ink3 md:grid ' + ROW_GRID}>
            <span>Item name</span><span>Price (₹)</span><span>Warranty (months)</span><span>Warranty expires</span><span></span>
          </div>
          <ul className="flex flex-col gap-3">
            ${f.items.map((it, i) => html`<${ItemRow} key=${it.key} item=${it} index=${i} canRemove=${f.items.length > 1} err=${shown.items[it.key]} dateIso=${f.date}
              onChange=${changeItem} onRemove=${removeItem} />`)}
          </ul>
          <datalist id="warranty-presets"><option value="6"></option><option value="12"></option><option value="24"></option><option value="36"></option><option value="60"></option></datalist>
        </fieldset>
      </form>

      ${confirmClose
        ? html`<div className="flex flex-wrap items-center justify-between gap-3 border-t border-line bg-warnsoft px-5 py-3" role="alertdialog" aria-label="Discard changes">
            <p className="text-sm font-medium text-warn">Discard this bill? Your entries will be lost.</p>
            <div className="flex gap-2">
              <button type="button" className=${btnGhost} onClick=${() => setConfirmClose(false)}>Keep editing</button>
              <button type="button" className=${btnDanger} onClick=${onClose}>Discard</button>
            </div>
          </div>`
        : html`<div className="flex flex-wrap items-center justify-between gap-3 border-t border-line bg-surface2 px-5 py-3">
            <p className="text-[13px] text-ink2 tabular-nums">Items total <span className="font-mono font-medium text-ink">${fmtMoney(itemsTotal)}</span>
              <span className="mx-1.5 text-ink3">·</span>Bill total <span className="font-mono font-medium text-ink">${amountNum === null ? '—' : fmtMoney(amountNum)}</span></p>
            <div className="flex gap-2">
              <button type="button" className=${btnGhost} onClick=${requestClose}>Cancel</button>
              <button type="submit" form="bill-form" className=${btnPrimary}><${Icon} name="check" size=${17} />Save bill</button>
            </div>
          </div>`}
    </div>
  </div>`;
}

/* ================= header ================= */
function Header({ query, setQuery, searchRef, expiringCount, onBell, pushToast }) {
  const [open, setOpen] = useState(false);
  const wrap = useRef(null);
  useEffect(() => {
    const down = (e) => { if (wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    const key = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', down);
    document.addEventListener('keydown', key);
    return () => { document.removeEventListener('mousedown', down); document.removeEventListener('keydown', key); };
  }, []);
  const items = [
    { icon: 'user', label: 'Profile', msg: "Profile isn't connected in this preview." },
    { icon: 'bell', label: 'Alert preferences', msg: "Alert preferences aren't connected in this preview." },
    { icon: 'sliders', label: 'Settings', msg: "Settings aren't connected in this preview." }

  return html`<header className="gutter sticky z-20 border-b border-line bg-surface" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
    <div className="mx-auto flex h-16 max-w-[1280px] items-center gap-3">
      <a href="#" className="flex shrink-0 items-center gap-2.5" aria-label="SBWMS home">

          <span className="block font-display text-[17px] font-bold tracking-tight">SBWMS</span>

          placeholder="Search bills, items, stores" aria-label="Search bills" value=${query} onInput=${(e) => setQuery(e.target.value)} />
        ${query
          ? html`<button type="button" className="absolute right-1.5 top-1/2 grid h-7 w-7 -translate-y-1/2 place-items-center rounded-md text-ink3 hover:bg-surface2 hover:text-ink" aria-label="Clear search" onClick=${() => { setQuery(''); searchRef.current && searchRef.current.focus(); }}><${Icon} name="x" size=${15} /></button>`
          : html`<kbd className="pointer-events-none absolute right-2.5 top-1/2 hidden -translate-y-1/2 rounded border border-line bg-surface2 px-1.5 font-mono text-[11px] text-ink3 sm:block">/</kbd>`}
      </div>
      <button type="button" className="relative grid h-10 w-10 shrink-0 place-items-center rounded-lg text-ink2 transition-colors hover:bg-surface2 hover:text-ink" aria-label=${'Warranties expiring soon: ' + expiringCount} onClick=${onBell}>
        <${Icon} name="bell" size=${20} />

      <div className="relative shrink-0" ref=${wrap}>
        <button type="button" className="flex h-10 items-center gap-2 rounded-lg pl-1 pr-2 transition-colors hover:bg-surface2" aria-haspopup="menu" aria-expanded=${open} onClick=${() => setOpen(!open)}>
          <span className="grid h-8 w-8 place-items-center rounded-full bg-accentsoft text-sm font-semibold text-accenttext">D</span>
          <span className="hidden text-sm font-medium sm:block">Demo account</span>
          <${Icon} name="chevron" size=${16} className="hidden text-ink3 sm:block" />
        </button>
        ${open && html`<div role="menu" className="pop rise absolute right-0 top-full z-30 mt-2 w-64 overflow-hidden rounded-xl border border-line bg-surface">
          <div className="border-b border-line px-4 py-3">
            <div className="text-sm font-semibold">Demo account</div>
            <div className="font-mono text-xs text-ink3">demo@sbwms.app</div>
          </div>
          <div className="p-1.5">
            ${items.map((it) => html`<button key=${it.label} type="button" role="menuitem" className="flex w-full items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-ink hover:bg-surface2" onClick=${() => { setOpen(false); pushToast(it.msg); }}>
              <${Icon} name=${it.icon} size=${17} className="text-ink2" />${it.label}</button>`)}
          </div>
          <div className="border-t border-line p-1.5">
            <button type="button" role="menuitem" className="flex w-full items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-crit hover:bg-critsoft" onClick=${() => { setOpen(false); pushToast("Sign out isn't connected in this preview."); }}>
              <${Icon} name="logout" size=${17} />Sign out</button>
          </div>
        </div>`}
      </div>
    </div>
  </header>`;
}

function MetricCard({ icon, tile, label, value, sub, badge }) {
  return html`<section className="flex flex-col gap-3 rounded-[14px] border border-line bg-surface p-5 transition-shadow hover:shadow-[0_6px_20px_rgba(18,25,41,0.08)]">
    <div className="flex items-start justify-between gap-3">
      <div className="min-w-0">
        <h2 className="text-[13px] font-medium text-ink2">${label}</h2>
        ${badge}
      </div>
      <span className=${'grid h-10 w-10 shrink-0 place-items-center rounded-[10px] ' + tile}><${Icon} name=${icon} size=${20} /></span>
    </div>
    <div className="font-display text-[30px] font-bold leading-none tracking-tight tabular-nums">${value}</div>
    <p className="text-[13px] text-ink3">${sub}</p>
  </section>`;
}

function SortTh({ label, k, sort, onSort, cls }) {
  const active = sort.key === k;
  return html`<th scope="col" aria-sort=${active ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'} className=${cls}>
    <button type="button" className=${'inline-flex items-center gap-1 uppercase tracking-[0.06em] transition-colors hover:text-ink ' + (active ? 'text-ink' : '')} onClick=${() => onSort(k)}>${label}<${Icon} name="sort" size=${12} /></button>
  </th>`;
}

/* bill name for lists: first item plus a count of the rest */
const BillName = ({ b }) => html`<${React.Fragment}>${b.items[0] ? b.items[0].item_name : 'Untitled bill'}${b.items.length > 1 && html`<span className="font-normal text-ink3"> +${b.items.length - 1} more</span>`}<//>`;
function warrantySub(b) {
  if (b.status === 'none') return 'Not covered';
  if (b.status === 'expired') return 'Ended ' + fmtDate(b.focus.expiry);
  return (b.coveredCount > 1 ? 'Next ends ' : 'Ends ') + fmtDate(b.focus.expiry);
}

/* ================= view-bill modal body ================= */
function BillDetails({ b, pushToast }) {
  const [showJson, setShowJson] = useState(false);
  const preRef = useRef(null);
  const json = useMemo(() => JSON.stringify(b.rec, null, 2), [b]);
  const markup = useMemo(() => (showJson ? highlight(json) : ''), [json, showJson]);
  const copy = () => {
    const fallback = () => {
      if (preRef.current) { const r = document.createRange(); r.selectNodeContents(preRef.current); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      pushToast('Copy was blocked here. The JSON is selected, press Ctrl+C or Cmd+C.');
    };
    try { navigator.clipboard.writeText(json).then(() => pushToast('JSON copied.'), fallback); } catch (e) { fallback(); }
  };
  const rows = [
    ['Store', b.store], ['Invoice', html`<span className="font-mono">${b.invoice}</span>`], ['Category', b.category],
    ['Purchased', fmtDate(b.purchased)], ['Total', html`<span className="font-mono tabular-nums">${fmtMoney(b.amount)}</span>`],
    ['Receipt', b.receipt ? b.receipt.file_name + ' (' + fmtSize(b.receipt.size_bytes) + ')' : 'None attached']
  ];
  return html`<${React.Fragment}>
    <dl className="grid gap-x-6 sm:grid-cols-2">
      ${rows.map(([k, v]) => html`<div key=${k} className="flex items-baseline justify-between gap-4 border-b border-line py-2.5 text-sm"><dt className="text-ink3">${k}</dt><dd className="min-w-0 truncate text-right font-medium">${v}</dd></div>`)}
    </dl>
    <h3 className="mb-2 mt-5 text-xs font-semibold uppercase tracking-[0.06em] text-ink3">Items (${b.items.length})</h3>
    <ul className="flex flex-col gap-2">
      ${b.items.map((it) => html`<li key=${it.id} className="rounded-xl border border-line bg-surface2 px-3.5 py-3">
        <div className="flex items-baseline justify-between gap-3">
          <p className="min-w-0 font-medium">${it.item_name}</p>
          <span className="shrink-0 font-mono text-[13px] font-medium tabular-nums">${fmtMoney(it.price)}</span>
        </div>
        <div className="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1">
          <${StatusBadge} status=${it.status} />
          <span className="text-xs text-ink3">${it.expiry ? (it.warranty_months + ' months · ends ' + fmtDate(it.expiry) + ' · ' + leftLabel(it.days)) : 'Not covered'}</span>
        </div>
      </li>`)}
    </ul>
    <div className="mt-5">
      <button type="button" className="inline-flex items-center gap-2 text-[13px] font-medium text-accenttext hover:underline" aria-expanded=${showJson} onClick=${() => setShowJson(!showJson)}>
        <${Icon} name="code" size=${16} />${showJson ? 'Hide database payload' : 'Show database payload'}</button>
      ${showJson && html`<div className="mt-2 overflow-hidden rounded-xl border border-line">
        <div className="flex items-center justify-between gap-2 border-b border-line bg-surface px-3 py-2">
          <span className="text-xs text-ink3">bills row + bill_items rows</span>
          <button type="button" className="inline-flex items-center gap-1.5 rounded-md px-2 py-1 text-xs font-medium text-accenttext hover:bg-accentsoft" onClick=${copy}><${Icon} name="copy" size=${14} />Copy JSON</button>
        </div>
        <pre ref=${preRef} tabIndex="0" aria-label="Database payload JSON" className="scroll-x m-0 max-h-72 overflow-auto bg-surface2 p-3 font-mono text-[12px] leading-relaxed" dangerouslySetInnerHTML=${{ __html: markup }}></pre>
      </div>`}
    </div>
  <//>`;
}

/* ================= app ================= */
function App() {
  const [store, setStore] = useState(loadStore);
  const [query, setQuery] = useState('');
  const [storeF, setStoreF] = useState('all');
  const [category, setCategory] = useState('all');
  const [status, setStatus] = useState('all');
  const [sort, setSort] = useState({ key: 'date', dir: 'desc' });
  const [page, setPage] = useState(1);
  const [modal, setModal] = useState(null);
  const [toasts, setToasts] = useState([]);
  const searchRef = useRef(null);
  const PAGE = 8;

  useEffect(() => { saveStore(store); }, [store]);

  const pushToast = useCallback((message, action) => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, message, action }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 5000);
  }, []);
  const dismissToast = (id) => setToasts((t) => t.filter((x) => x.id !== id));

  /* load saved bills from MongoDB */
  useEffect(() => {
    let alive = true;
    api('GET', '/api/bills')
      .then((list) => {
        if (!alive || !Array.isArray(list)) return;
        const ok = (r) => r && r.bill && r.bill.id && Array.isArray(r.items);
        setStore((s) => ({ ...s, added: list.filter(ok) }));
      })
      .catch(() => { if (alive) pushToast("Couldn't reach the database server. Showing bills saved in this browser."); });
    return () => { alive = false; };
  }, [pushToast]);

  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) && !modal) {
        e.preventDefault();
        if (searchRef.current) searchRef.current.focus();
      }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [modal]);

  const records = useMemo(() => [...store.added, ...(SHOW_SAMPLE_DATA ? SEED : []).filter((r) => !store.removed.includes(r.bill.id))], [store]);
  const bills = useMemo(() => records.map(enrich), [records]);
  const stores = useMemo(() => [...new Set(bills.map((b) => b.store))].sort(), [bills]);

  const metrics = useMemo(() => {
    const allItems = bills.flatMap((b) => b.items.map((it) => ({ ...it, bill: b })));
    const expiring = allItems.filter((i) => i.status === 'expiring').sort((a, c) => a.days - c.days);
    const spent = bills.reduce((s, b) => s + b.amount, 0);
    return {
      total: bills.length,
      newThisMonth: bills.filter((b) => daysBetween(b.purchased, TODAY) <= 30).length,
      active: allItems.filter((i) => i.status === 'active' || i.status === 'expiring').length,
      expired: allItems.filter((i) => i.status === 'expired').length,
      expiring,
      urgent: expiring.filter((i) => i.days <= 7).length,
      expiringValue: expiring.reduce((s, i) => s + i.price, 0),
      spent,
      avg: bills.length ? Math.round(spent / bills.length) : 0
    };
  }, [bills]);

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    const list = bills.filter((b) =>
      (storeF === 'all' || b.store === storeF) &&
      (category === 'all' || b.category === category) &&
      (status === 'all' || b.status === status) &&
      (!q || (b.store + ' ' + b.invoice + ' ' + b.category + ' ' + b.items.map((i) => i.item_name).join(' ')).toLowerCase().includes(q)));
    const dir = sort.dir === 'asc' ? 1 : -1;
    list.sort((a, c) => {
      if (sort.key === 'amount') return (a.amount - c.amount) * dir;
      if (sort.key === 'name') return ((a.items[0] ? a.items[0].item_name : '').localeCompare(c.items[0] ? c.items[0].item_name : '')) * dir;
      return (a.purchased - c.purchased) * dir;
    });
    return list;
  }, [bills, query, storeF, category, status, sort]);

  useEffect(() => { setPage(1); }, [query, storeF, category, status, sort]);
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  const cur = Math.min(page, pages);
  const visible = rows.slice((cur - 1) * PAGE, cur * PAGE);
  const filtersOn = storeF !== 'all' || category !== 'all' || status !== 'all' || query.trim() !== '';
  const clearFilters = () => { setStoreF('all'); setCategory('all'); setStatus('all'); setQuery(''); };

  const onSort = (key) => setSort((s) => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: key === 'name' ? 'asc' : 'desc' });
  const onView = (b) => setModal({ type: 'view', id: b.id });
  const onDelete = (b) => setModal({ type: 'delete', id: b.id });
  const onDownload = (b) => pushToast("PDF export isn't connected in this preview (" + b.invoice + ').');
  const goExpiring = () => {
    const el = document.getElementById('expiring');
    if (el) { el.scrollIntoView({ block: 'start' }); el.focus({ preventScroll: true }); }
  };

  const confirmDelete = (b) => {
    const rec = b.rec;
    const isSeed = SEED_IDS.has(rec.bill.id);
    setStore((s) => isSeed ? { ...s, removed: [...s.removed, rec.bill.id] } : { ...s, added: s.added.filter((r) => r.bill.id !== rec.bill.id) });
    if (!isSeed) api('DELETE', '/api/bills/' + encodeURIComponent(rec.bill.id)).catch(() => pushToast("Couldn't delete this bill from the database."));
    setModal(null);
    pushToast('Deleted ' + b.store + ' bill ' + b.invoice + '.', {
      label: 'Undo',
      run: () => {
        setStore((s) => isSeed ? { ...s, removed: s.removed.filter((id) => id !== rec.bill.id) } : { ...s, added: [rec, ...s.added] });
        if (!isSeed) api('POST', '/api/bills', rec).catch(() => pushToast("Couldn't restore this bill in the database."));
      }
    });
  };
  const saveBill = (payload) => {
    setStore((s) => ({ ...s, added: [payload, ...s.added] }));
    api('POST', '/api/bills', payload).catch(() => pushToast('Saved in this browser only. The database server is unreachable.'));
    setModal(null);
    setSort({ key: 'date', dir: 'desc' });
    pushToast('Saved ' + payload.bill.store_name + ' bill with ' + payload.items.length + (payload.items.length === 1 ? ' item.' : ' items.'));
  };

  const dateStr = TODAY.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const windowEnd = fmtDate(addDays(TODAY, 30));
  const thBase = 'bg-surface2 border-y border-line text-[11px] font-semibold text-ink3 ';
  const chips = [['all', 'All'], ['active', 'Active'], ['expiring', 'Expiring'], ['expired', 'Expired'], ['none', 'No warranty']];
  const modalBill = modal && modal.id ? bills.find((b) => b.id === modal.id) : null;

  const expiringBadge = metrics.expiring.length > 0
    ? html`<span className="mt-1 inline-flex items-center gap-1.5 rounded-full bg-warnsoft px-2 py-0.5 text-[11px] font-semibold text-warn">
        <span className="relative flex h-1.5 w-1.5"><span className="absolute inline-flex h-full w-full rounded-full bg-warnbar opacity-70 motion-safe:animate-ping"></span><span className="relative inline-flex h-1.5 w-1.5 rounded-full bg-warnbar"></span></span>Action needed</span>`
    : html`<span className="mt-1 inline-flex items-center gap-1.5 rounded-full bg-goodsoft px-2 py-0.5 text-[11px] font-semibold text-good">All clear</span>`;

  return html`<${React.Fragment}>
    <${Header} query=${query} setQuery=${setQuery} searchRef=${searchRef} expiringCount=${metrics.expiring.length} onBell=${goExpiring} pushToast=${pushToast} />

    <main className="gutter pb-16 pt-7">
      <div className="mx-auto flex max-w-[1280px] flex-col gap-6">

        <div className="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 className="font-display text-[28px] font-bold leading-tight tracking-tight">Dashboard</h1>
            <p className="text-[13px] text-ink2">${dateStr} <span className="mx-1 text-ink3">·</span> <span className="text-ink3">Sample data plus your additions</span></p>
          </div>
          <button type="button" className=${btnPrimary} onClick=${() => setModal({ type: 'add' })}><${Icon} name="plus" size=${18} />Add bill</button>
        </div>

        <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <${MetricCard} icon="receipt" tile="bg-accentsoft text-accenttext" label="Total bills stored" value=${metrics.total}
            sub=${metrics.newThisMonth + ' added in the last 30 days'} />
          <${MetricCard} icon="shield" tile="bg-goodsoft text-good" label="Active warranties" value=${metrics.active}
            sub=${metrics.expired + (metrics.expired === 1 ? ' item warranty has expired' : ' item warranties have expired')} />
          <${MetricCard} icon="alert" tile="bg-warnsoft text-warn" label="Expiring soon" value=${metrics.expiring.length} badge=${expiringBadge}
            sub=${metrics.urgent > 0 ? metrics.urgent + (metrics.urgent === 1 ? ' ends within 7 days' : ' end within 7 days') : 'Items ending in the next 30 days'} />
          <${MetricCard} icon="wallet" tile="bg-surface2 text-ink2" label="Total spent" value=${fmtMoney0(metrics.spent)}
            sub=${'Average ' + fmtMoney0(metrics.avg) + ' per bill'} />
        </div>

        <div className="grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_340px]">

          <section className="min-w-0 overflow-hidden rounded-[14px] border border-line bg-surface" aria-labelledby="bills-title">
            <div className="flex flex-col gap-4 p-5">
              <div className="flex flex-wrap items-baseline justify-between gap-2">
                <h2 id="bills-title" className="font-display text-lg font-semibold tracking-tight">Recent bills</h2>
                <p className="text-[13px] text-ink3" aria-live="polite">${rows.length} of ${bills.length} bills${filtersOn ? ' match' : ''}</p>
              </div>
              <div className="flex flex-wrap items-end gap-3">
                <div className="relative w-full sm:w-44">
                  <label htmlFor="filter-store" className="mb-1 block text-xs font-medium text-ink3">Store</label>
                  <select id="filter-store" className="field" value=${storeF} onChange=${(e) => setStoreF(e.target.value)}>
                    <option value="all">All stores</option>${stores.map((s) => html`<option key=${s} value=${s}>${s}</option>`)}
                  </select>
                  <span className="pointer-events-none absolute bottom-[11px] right-3 text-ink3"><${Icon} name="chevron" size=${16} /></span>
                </div>
                <div className="relative w-full sm:w-44">
                  <label htmlFor="filter-category" className="mb-1 block text-xs font-medium text-ink3">Category</label>
                  <select id="filter-category" className="field" value=${category} onChange=${(e) => setCategory(e.target.value)}>
                    <option value="all">All categories</option>${CATEGORIES.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}
                  </select>
                  <span className="pointer-events-none absolute bottom-[11px] right-3 text-ink3"><${Icon} name="chevron" size=${16} /></span>
                </div>
                <div className="flex flex-wrap items-center gap-1.5" role="group" aria-label="Warranty status">
                  ${chips.map(([k, label]) => html`<button key=${k} type="button" aria-pressed=${status === k}
                    className=${'h-8 rounded-full border px-3 text-[13px] font-medium transition-colors ' + (status === k ? 'border-accent bg-accent text-white' : 'border-line bg-surface text-ink2 hover:bg-surface2 hover:text-ink')}
                    onClick=${() => setStatus(k)}>${label}</button>`)}
                  ${filtersOn && html`<button type="button" className="h-8 rounded-full px-2.5 text-[13px] font-medium text-accenttext hover:underline" onClick=${clearFilters}>Clear</button>`}
                </div>
              </div>
            </div>

            ${rows.length === 0
              ? html`<div className="flex flex-col items-center gap-3 border-t border-line px-6 py-14 text-center">
                  <span className="grid h-12 w-12 place-items-center rounded-full bg-surface2 text-ink3"><${Icon} name="inbox" size=${24} /></span>
                  <div><p className="font-medium">No bills match these filters</p><p className="text-[13px] text-ink3">Try a different store, category or search term.</p></div>
                  <button type="button" className=${btnGhost} onClick=${clearFilters}>Clear filters</button>
                </div>`
              : html`<${React.Fragment}>
                  <div className="scroll-x hidden overflow-x-auto md:block">
                    <table className="w-full text-left text-[13.5px]">
                      <thead><tr>
                        <${SortTh} label="Items" k="name" sort=${sort} onSort=${onSort} cls=${'pl-5 pr-3 py-3 ' + thBase} />
                        <th scope="col" className=${'hidden px-3 py-3 xl:table-cell ' + thBase}><span className="uppercase tracking-[0.06em]">Store</span></th>
                        <th scope="col" className=${'hidden px-3 py-3 xl:table-cell ' + thBase}><span className="uppercase tracking-[0.06em]">Category</span></th>
                        <${SortTh} label="Date" k="date" sort=${sort} onSort=${onSort} cls=${'px-3 py-3 ' + thBase} />
                        <${SortTh} label="Amount" k="amount" sort=${sort} onSort=${onSort} cls=${'px-3 py-3 text-right ' + thBase} />
                        <th scope="col" className=${'px-3 py-3 ' + thBase}><span className="uppercase tracking-[0.06em]">Warranty</span></th>
                        <th scope="col" className=${'py-3 pl-3 pr-4 text-right ' + thBase}><span className="sr-only">Actions</span></th>
                      </tr></thead>
                      <tbody>
                        ${visible.map((b) => html`<tr key=${b.id} className="border-b border-line transition-colors last:border-0 hover:bg-surface2">
                          <td className="max-w-[260px] py-3 pl-5 pr-3">
                            <button type="button" className="block max-w-full truncate text-left font-medium hover:text-accenttext hover:underline" onClick=${() => onView(b)}><${BillName} b=${b} /></button>
                            <div className="truncate font-mono text-xs text-ink3"><span className="font-sans xl:hidden">${b.store} · </span>${b.invoice}</div>
                          </td>
                          <td className="hidden whitespace-nowrap px-3 py-3 text-ink2 xl:table-cell">${b.store}</td>
                          <td className="hidden whitespace-nowrap px-3 py-3 text-ink2 xl:table-cell">${b.category}</td>
                          <td className="whitespace-nowrap px-3 py-3 tabular-nums text-ink2">${fmtDate(b.purchased)}</td>
                          <td className="whitespace-nowrap px-3 py-3 text-right font-mono text-[13px] font-medium tabular-nums">${fmtMoney0(b.amount)}</td>
                          <td className="whitespace-nowrap px-3 py-3">
                            <${StatusBadge} status=${b.status} />
                            <div className="mt-0.5 text-xs text-ink3">${warrantySub(b)}</div>
                          </td>
                          <td className="py-3 pl-3 pr-4"><${RowActions} bill=${b} onView=${onView} onDownload=${onDownload} onDelete=${onDelete} /></td>
                        </tr>`)}
                      </tbody>
                    </table>
                  </div>

                  <ul className="divide-y divide-line border-t border-line md:hidden">
                    ${visible.map((b) => html`<li key=${b.id} className="flex flex-col gap-3 px-4 py-4">
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                          <button type="button" className="block max-w-full text-left font-medium leading-snug" onClick=${() => onView(b)}><${BillName} b=${b} /></button>
                          <p className="text-xs text-ink3">${b.store} · ${b.category} · ${fmtDate(b.purchased)}</p>
                        </div>
                        <span className="shrink-0 font-mono text-[13px] font-medium tabular-nums">${fmtMoney0(b.amount)}</span>
                      </div>
                      <div className="flex items-center justify-between gap-3">
                        <div><${StatusBadge} status=${b.status} /><div className="mt-0.5 text-xs text-ink3">${b.focus ? leftLabel(b.focus.days) : 'Not covered'}</div></div>
                        <${RowActions} bill=${b} onView=${onView} onDownload=${onDownload} onDelete=${onDelete} />
                      </div>
                    </li>`)}
                  </ul>

                  <div className="flex flex-wrap items-center justify-between gap-3 border-t border-line px-5 py-3 text-[13px] text-ink2">
                    <span className="tabular-nums">Showing ${(cur - 1) * PAGE + 1}–${Math.min(cur * PAGE, rows.length)} of ${rows.length}</span>
                    <div className="flex items-center gap-1.5">
                      <button type="button" className="grid h-8 w-8 place-items-center rounded-md border border-line transition-colors hover:bg-surface2 disabled:opacity-40 disabled:hover:bg-transparent" disabled=${cur <= 1} aria-label="Previous page" onClick=${() => setPage(cur - 1)}><${Icon} name="chevL" size=${16} /></button>
                      <span className="px-1 tabular-nums">Page ${cur} of ${pages}</span>
                      <button type="button" className="grid h-8 w-8 place-items-center rounded-md border border-line transition-colors hover:bg-surface2 disabled:opacity-40 disabled:hover:bg-transparent" disabled=${cur >= pages} aria-label="Next page" onClick=${() => setPage(cur + 1)}><${Icon} name="chevR" size=${16} /></button>
                    </div>
                  </div>
                <//>`}
          </section>

          <aside id="expiring" tabIndex="-1" className="min-w-0 rounded-[14px] border border-line bg-surface outline-none lg:sticky lg:top-24" aria-labelledby="exp-title">
            <div className="flex items-start justify-between gap-3 p-5 pb-4">
              <div>
                <h2 id="exp-title" className="font-display text-lg font-semibold tracking-tight">Expiring soon</h2>
                <p className="text-[13px] text-ink3">Item warranties ending by ${windowEnd}</p>
              </div>
              <span className=${'grid h-7 min-w-[28px] place-items-center rounded-full px-2 text-[13px] font-semibold tabular-nums ' + (metrics.expiring.length ? 'bg-warnsoft text-warn' : 'bg-goodsoft text-good')}>${metrics.expiring.length}</span>
            </div>
            ${metrics.expiring.length === 0
              ? html`<div className="flex flex-col items-center gap-2 border-t border-line px-6 py-10 text-center">
                  <span className="grid h-11 w-11 place-items-center rounded-full bg-goodsoft text-good"><${Icon} name="shield" size=${22} /></span>
                  <p className="font-medium">Nothing expires in the next 30 days</p>
                  <p className="text-[13px] text-ink3">New alerts show up here as warranties get close to their end date.</p>
                </div>`
              : html`<ul className="border-t border-line">
                  ${metrics.expiring.map((it) => {
                    const total = Math.max(1, daysBetween(it.bill.purchased, it.expiry));
                    const pct = Math.max(4, Math.min(100, Math.round((it.days / total) * 100)));
                    const hot = it.days <= 7;
                    return html`<li key=${it.id} className="border-b border-line last:border-0">
                      <button type="button" className="block w-full px-5 py-3.5 text-left transition-colors hover:bg-surface2" onClick=${() => onView(it.bill)} aria-label=${'View ' + it.item_name + ', ' + leftLabel(it.days)}>
                        <div className="flex items-start justify-between gap-3">
                          <div className="min-w-0">
                            <p className="truncate font-medium">${it.item_name}</p>
                            <p className="truncate text-xs text-ink3">${it.bill.store} · ends ${fmtDate(it.expiry)}</p>
                          </div>
                          <span className=${'inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold tabular-nums ' + (hot ? 'bg-critsoft text-crit' : 'bg-warnsoft text-warn')}><${Icon} name="clock" size=${12} />${it.days === 0 ? 'Today' : it.days + 'd'}</span>
                        </div>
                        <div className="mt-2.5 h-1.5 overflow-hidden rounded-full bg-surface2" role="presentation">
                          <div className=${'h-full rounded-full ' + (hot ? 'bg-crit' : 'bg-warnbar')} style=${{ width: pct + '%' }}></div>
                        </div>
                      </button>
                    </li>`;
                  })}
                </ul>
                <div className="rounded-b-[14px] border-t border-line bg-surface2 px-5 py-3 text-[13px] text-ink2">
                  <span className="font-mono font-medium tabular-nums text-ink">${fmtMoney0(metrics.expiringValue)}</span> of purchases lose cover soon. Claim any repairs before the end date.
                </div>`}
          </aside>
        </div>
      </div>
    </main>

    ${modal && modal.type === 'view' && modalBill && html`<${Modal} wide=${true} title=${modalBill.store + ' · ' + modalBill.invoice} onClose=${() => setModal(null)} footer=${html`<${React.Fragment}>
        <button type="button" className=${btnGhost} onClick=${() => setModal(null)}>Close</button>
        <button type="button" className=${btnPrimary} onClick=${() => onDownload(modalBill)}><${Icon} name="download" size=${17} />Download PDF</button>
      <//>`}>
      <${BillDetails} b=${modalBill} pushToast=${pushToast} />
    <//>`}

    ${modal && modal.type === 'delete' && modalBill && html`<${Modal} title="Delete this bill?" onClose=${() => setModal(null)} footer=${html`<${React.Fragment}>
        <button type="button" className=${btnGhost} onClick=${() => setModal(null)}>Cancel</button>
        <button type="button" className=${btnDanger} onClick=${() => confirmDelete(modalBill)}><${Icon} name="trash" size=${17} />Delete bill</button>
      <//>`}>
      <p className="text-sm text-ink2"><span className="font-medium text-ink">${modalBill.store}</span> bill ${modalBill.invoice} with ${modalBill.items.length} ${modalBill.items.length === 1 ? 'item' : 'items'} and its warranty records will be removed. You can undo this right after.</p>
    <//>`}

    ${modal && modal.type === 'add' && html`<${AddBillModal} stores=${stores} onClose=${() => setModal(null)} onSubmit=${saveBill} />`}

    <div className="pointer-events-none fixed inset-x-0 z-[60] flex flex-col items-center gap-2 px-4" style=${{ bottom: 'calc(16px + env(safe-area-inset-bottom, 0px))' }} role="status" aria-live="polite">
      ${toasts.map((t) => html`<div key=${t.id} className="pop rise pointer-events-auto flex max-w-md items-center gap-3 rounded-xl bg-ink px-4 py-2.5 text-sm text-bg">
        <span>${t.message}</span>
        ${t.action && html`<button type="button" className="font-semibold underline underline-offset-2" onClick=${() => { t.action.run(); dismissToast(t.id); }}>${t.action.label}</button>`}
        <button type="button" className="-mr-1 grid h-6 w-6 place-items-center rounded opacity-70 hover:opacity-100" aria-label="Dismiss" onClick=${() => dismissToast(t.id)}><${Icon} name="x" size=${14} /></button>
      </div>`)}
    </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body></html>
